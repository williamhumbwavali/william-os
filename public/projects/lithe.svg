  <circle cx="52" cy="52" r="6" fill="#F27878"/>
  <circle cx="72" cy="52" r="6" fill="#E8B04B"/>
  <circle cx="92" cy="52" r="6" fill="#7FD88F"/>
  <text x="400" y="56" text-anchor="middle" font-family="monospace" font-size="14" fill="#7C8A9C">lithephp/framework — routes/web.php</text>
  <line x1="24" y1="76" x2="776" y2="76" stroke="#241a33" stroke-width="1.5"/>
  <g font-family="monospace" font-size="16" fill="#C792EA">
    <text x="56" y="130">use function Lithe\Orbis\http\Router;</text>
    <text x="56" y="170" fill="#7C8A9C">$app = new Lithe\App();</text>
    <text x="56" y="210"><tspan fill="#C792EA">$app</tspan><tspan fill="#7C8A9C">-&gt;</tspan><tspan fill="#5CCFE6">get</tspan><tspan fill="#7C8A9C">(</tspan><tspan fill="#E8B04B">'/hello/:name'</tspan><tspan fill="#7C8A9C">, function ($req, $res) {</tspan></text>
    <text x="90" y="250" fill="#7C8A9C">$res-&gt;<tspan fill="#5CCFE6">send</tspan>(<tspan fill="#E8B04B">'Hello, '</tspan> . $req-&gt;param(<tspan fill="#E8B04B">'name'</tspan>));</text>
    <text x="56" y="290" fill="#7C8A9C">});</text>
    <text x="56" y="330" fill="#586372">$app-&gt;listen();</text>
  </g>
